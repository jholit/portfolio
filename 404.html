<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The requested page could not be found in Jaqweal Holit's portfolio."
    />
    <meta name="author" content="Jaqweal Holit" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />

    <title>Page Not Found | JH Portfolio</title>

    <script>
      (() => {
        const pathSegments = window.location.pathname
          .split("/")
          .filter(Boolean);
        const isGitHubPagesHost =
          window.location.hostname.endsWith(".github.io");
        const candidateRoot =
          isGitHubPagesHost && pathSegments.length > 1
            ? `/${pathSegments[0]}/`
            : "/";

        const applySiteRoot = (siteRoot) => {
          document.documentElement.style.setProperty(
            "--site-background",
            `url("${siteRoot}image/asset/bg.webp")`,
          );

          const homeLink = document.querySelector("[data-home-link]");

          if (homeLink) {
            homeLink.href = siteRoot;
          }
        };

        applySiteRoot(candidateRoot);

        window.addEventListener("DOMContentLoaded", () => {
          applySiteRoot(candidateRoot);

          if (candidateRoot === "/") {
            return;
          }

          window
            .fetch(candidateRoot, {
              method: "HEAD",
              cache: "force-cache",
              credentials: "same-origin",
            })
            .then((response) => {
              if (!response.ok) {
                applySiteRoot("/");
              }
            })
            .catch(() => {
              applySiteRoot("/");
            });
        });
      })();
    </script>

    <style>
      :root {
        --site-background: none;
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #000000;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: clamp(24px, 6vw, 80px);
        display: grid;
        place-items: center;
        color: #ffffff;
        background:
          linear-gradient(rgba(0, 0, 0, 0.54), rgba(0, 0, 0, 0.76)),
          var(--site-background) center / cover no-repeat fixed,
          #000000;
      }

      .error-page {
        width: min(100%, 640px);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 12px;
        text-align: center;
        background: rgba(10, 14, 20, 0.84);
        box-shadow: 0 24px 72px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
      }

      .error-page__code {
        margin: 0 0 8px;
        color: #c6fbbf;
        font-size: clamp(56px, 14vw, 104px);
        font-weight: 800;
        line-height: 1;
      }

      .error-page__title {
        margin: 0;
        font-size: clamp(24px, 5vw, 36px);
        line-height: 1.2;
      }

      .error-page__text {
        margin: 18px auto 28px;
        color: rgba(255, 255, 255, 0.78);
        font-size: 16px;
        line-height: 1.7;
      }

      .error-page__link {
        min-height: 44px;
        padding: 0 20px;
        border-radius: 999px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: #000000;
        font-weight: 700;
        text-decoration: none;
        background: #c6fbbf;
        transition:
          background-color 160ms ease,
          transform 160ms ease;
      }

      .error-page__link:hover {
        background: #ffffff;
        transform: translateY(-1px);
      }

      .error-page__link:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 4px;
      }

      @media (prefers-reduced-motion: reduce) {
        .error-page__link {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="error-page">
      <p class="error-page__code" aria-hidden="true">404</p>
      <h1 class="error-page__title">Page not found</h1>
      <p class="error-page__text">
        The page may have moved, or the address may be incorrect. Return to the
        portfolio homepage to continue.
      </p>
      <a class="error-page__link" href="/" data-home-link>
        Return to portfolio
      </a>
    </main>
  </body>
</html>
